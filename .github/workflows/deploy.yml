# Publica el sitio en GitHub Pages en cada push a main.
#
# REQUISITO PREVIO, una sola vez y a mano:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
#
# No se puede automatizar: el GITHUB_TOKEN del workflow puede
# desplegar en Pages, pero no puede crear el sitio de Pages (eso
# exige permisos de administración del repo). Sin ese paso, el job
# "desplegar" termina siempre en 404.

name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Si haces varios push seguidos, deja que termine el que está corriendo.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Preparar Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar el sitio
        run: npm run build

      - name: Subir el resultado
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
