# Publica el sitio en GitHub Pages en cada push a main.
#
# ANTES DEL PRIMER DEPLOY, en tu repo de GitHub:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
# (No elijas "Deploy from a branch".)

name: Desplegar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Si haces varios push seguidos, deja que termine el que está corriendo.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar el sitio
        run: npm run build

      - name: Subir el resultado
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  desplegar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
